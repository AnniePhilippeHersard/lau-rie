# Publie le site sur GitHub Pages, avec une vraie page par séance pour Google.
# Se lance à chaque modification du dépôt, chaque nuit (pour les séances ajoutées
# depuis l'espace photographe) et à la demande (Actions → Publier le site → Run workflow).
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # chaque nuit, 3 h 17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pages des séances et sitemap
        run: node tools/pages-seo.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
