# Sauvegarde automatique de la base, le 1er de chaque mois, chiffrée par une phrase secrète.
# Le fichier chiffré se télécharge 90 jours dans Actions → Sauvegarde mensuelle → (une exécution) → Artifacts.
# Nécessite deux secrets du dépôt (Settings → Secrets and variables → Actions) :
#   SUPABASE_SERVICE_ROLE_KEY : la clé « secret » / service_role du projet Supabase
#   BACKUP_PASSPHRASE         : une longue phrase inventée, gardée précieusement (sans elle, la sauvegarde est illisible)
# Sans ces secrets, la tâche ne fait rien et le signale.
name: Sauvegarde mensuelle

on:
  schedule:
    - cron: "23 4 1 * *"   # le 1er du mois, 4 h 23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export de la base
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tools/sauvegarde.mjs sauvegarde.json
      - name: Chiffrement
        id: chiffre
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ ! -f sauvegarde.json ]; then echo "fait=non" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BACKUP_PASSPHRASE" ]; then echo "::warning::Secret BACKUP_PASSPHRASE absent : sauvegarde non conservée (elle contient des données clients)."; rm -f sauvegarde.json; echo "fait=non" >> "$GITHUB_OUTPUT"; exit 0; fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in sauvegarde.json -out "sauvegarde-$(date +%Y-%m-%d).json.enc" -pass env:BACKUP_PASSPHRASE
          rm -f sauvegarde.json
          echo "fait=oui" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.chiffre.outputs.fait == 'oui'
        with:
          name: sauvegarde-chiffree
          path: sauvegarde-*.json.enc
          retention-days: 90
